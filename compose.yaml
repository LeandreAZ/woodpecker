name: woodpecker

services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_started
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-woodpecker}:${POSTGRES_PASSWORD:-woodpecker}@database:5432/${POSTGRES_DB:-woodpecker}?serverVersion=17&charset=utf8"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    working_dir: /app
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-woodpecker}"
      POSTGRES_USER: "${POSTGRES_USER:-woodpecker}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-woodpecker}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-woodpecker} -d ${POSTGRES_DB:-woodpecker}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - database_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  database_data:
  frontend_node_modules:
