# Dedicated network, database, caches and dependencies. No personal data volumes.
name: woodpecker-e2e
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: woodpecker_e2e
      POSTGRES_USER: woodpecker
      POSTGRES_PASSWORD: woodpecker
    healthcheck:
      test: [CMD-SHELL, pg_isready -U woodpecker -d woodpecker_e2e]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - e2e_database:/var/lib/postgresql/data
  php:
    image: woodpecker-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    environment:
      APP_ENV: dev
      WOODPECKER_E2E: '1'
      DATABASE_URL: postgresql://woodpecker:woodpecker@database:5432/woodpecker_e2e?serverVersion=17&charset=utf8
    volumes:
      - ./backend:/var/www/html
      - e2e_vendor:/var/www/html/vendor
      - e2e_jwt:/var/www/html/config/jwt
      - e2e_var:/var/www/html/var
      - e2e_uploads:/var/www/html/public/uploads
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 2s
      timeout: 5s
      retries: 90
    depends_on:
      database:
        condition: service_healthy
  nginx:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:8088:80']
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]
  frontend:
    image: woodpecker-frontend
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    working_dir: /app
    ports: ['127.0.0.1:5183:5173']
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: frontend
    volumes:
      - ./frontend:/app
      - e2e_node_modules:/app/node_modules
    depends_on: [nginx]
  runner:
    build:
      context: .
      dockerfile: docker/e2e/Dockerfile
    init: true
    shm_size: 1gb
    working_dir: /app
    environment:
      E2E_BASE_URL: http://frontend:5173
    volumes:
      - ./frontend:/app
      - e2e_node_modules:/app/node_modules
      - ./docs/testing/fixtures:/fixtures:ro
    profiles: [e2e]
volumes:
  e2e_database:
  e2e_vendor:
  e2e_jwt:
  e2e_var:
  e2e_uploads:
  e2e_node_modules:
