# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Controller\TrainingOverviewAction:
        public: true
        tags: ['controller.service_arguments']

    App\Controller\TrainingSummaryAction:
        public: true
        tags: ['controller.service_arguments']

    App\Controller\TrainingAnalyticsAction:
        public: true
        tags: ['controller.service_arguments']

    App\Controller\TrainingAttemptHistoryAction:
        public: true
        tags: ['controller.service_arguments']

    App\Controller\TrainingCycleHistoryAction:
        public: true
        tags: ['controller.service_arguments']

    App\Controller\TrainingDashboardAction:
        public: true
        tags: ['controller.service_arguments']

    App\Controller\StatsOverviewAction:
        public: true
        tags: ['controller.service_arguments']

    App\Controller\HistoryOverviewAction:
        public: true
        tags: ['controller.service_arguments']

    App\Controller\AuthLogoutAction:
        public: true
        tags: ['controller.service_arguments']

    App\Controller\UserSettingsOverviewAction:
        public: true
        tags: ['controller.service_arguments']

    App\Doctrine\CurrentUserTrainingScopeExtension:
        tags:
            - { name: api_platform.doctrine.orm.query_extension.collection }
            - { name: api_platform.doctrine.orm.query_extension.item }

    # Keep CSV analyses in the writable cache directory across HTTP requests.
    app.csv_import.filesystem:
        parent: cache.adapter.filesystem
        arguments:
            $directory: '%kernel.cache_dir%/csv-import'
