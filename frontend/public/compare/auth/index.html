<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comparaison auth</title>
    <style>
      :root { color-scheme: dark; --bg:#050b14; --panel:rgba(10,19,31,.95); --line:rgba(154,173,204,.16); --text:#eef3fb; --muted:#95a7c2; }
      * { box-sizing:border-box; }
      body { margin:0; font-family:Inter,system-ui,sans-serif; color:var(--text); background:radial-gradient(circle at 18% 10%, rgba(92,142,255,.12), transparent 24%), radial-gradient(circle at 82% 6%, rgba(130,229,141,.12), transparent 20%), linear-gradient(180deg, #040912 0%, #07101a 52%, #050b14 100%); }
      .page { display:grid; gap:18px; padding:18px; }
      .topbar,.section { border:1px solid var(--line); border-radius:22px; background:var(--panel); box-shadow:0 24px 60px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.03); }
      .topbar { display:grid; gap:14px; padding:20px; }
      .topbar-head { display:flex; justify-content:space-between; align-items:end; gap:16px; flex-wrap:wrap; }
      h1 { margin:0; font-size:clamp(2rem,3vw,3rem); letter-spacing:-.04em; }
      p { margin:0; } .lead { color:var(--muted); line-height:1.6; max-width:72ch; }
      .links { display:flex; gap:10px; flex-wrap:wrap; }
      .links a { display:inline-flex; align-items:center; min-height:44px; padding:0 14px; border-radius:14px; border:1px solid var(--line); background:rgba(18,30,49,.92); color:var(--text); text-decoration:none; }
      .links a.active { background:linear-gradient(180deg, rgba(50,92,190,.95), rgba(30,58,122,.95)); border-color:rgba(96,143,255,.42); }
      .section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line); }
      .section-head strong { font-size:1.05rem; } .section-head span { color:var(--muted); font-size:.92rem; }
      .image-wrap { overflow:auto; padding:12px; background:linear-gradient(45deg, rgba(255,255,255,.025) 25%, transparent 25%), linear-gradient(-45deg, rgba(255,255,255,.025) 25%, transparent 25%), linear-gradient(45deg, transparent 75%, rgba(255,255,255,.025) 75%), linear-gradient(-45deg, transparent 75%, rgba(255,255,255,.025) 75%); background-size:24px 24px; background-position:0 0, 0 12px, 12px -12px, -12px 0; }
      .image-wrap img { display:block; width:100%; height:auto; border-radius:14px; }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="topbar">
        <div class="topbar-head">
          <div>
            <h1>Comparaison auth</h1>
            <p class="lead">Maquette de référence puis capture actuelle du site pour l’écran d’authentification.</p>
          </div>
          <nav class="links">
            <a class="active" href="/compare/auth/">auth</a>
            <a href="/compare/dashboard/">dashboard</a>
            <a href="/compare/detail/">detail</a>
            <a href="/compare/solver/">solver</a>
          </nav>
        </div>
      </section>
      <section class="section"><div class="section-head"><div><strong>Maquette</strong><span>call_XYmMTgPbi88PtETJt5W5L9gq.png</span></div></div><div class="image-wrap"><img src="/compare-assets/mockups/call_XYmMTgPbi88PtETJt5W5L9gq.png" alt="Maquette auth" /></div></section>
      <section class="section"><div class="section-head"><div><strong>Rendu actuel</strong><span>auth-current-2.png</span></div></div><div class="image-wrap"><img src="/compare-assets/current/auth-current-2.png" alt="Capture actuelle auth" /></div></section>
    </main>
  </body>
</html>
