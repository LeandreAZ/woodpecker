<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comparaison maquette / rendu</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07101a;
        --panel: rgba(11, 20, 33, 0.94);
        --panel-2: rgba(14, 25, 40, 0.92);
        --line: rgba(151, 170, 201, 0.16);
        --text: #eef3fb;
        --muted: #97a8c4;
        --accent: #82e58d;
        --accent-2: #4f84ff;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 20% 10%, rgba(79, 132, 255, 0.12), transparent 25%),
          radial-gradient(circle at 80% 0%, rgba(130, 229, 141, 0.12), transparent 22%),
          linear-gradient(180deg, #040912 0%, #07101a 52%, #050b14 100%);
      }

      .page {
        display: grid;
        gap: 18px;
        padding: 18px;
      }

      .toolbar,
      .viewer {
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--panel);
        box-shadow: 0 24px 60px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.03);
      }

      .toolbar {
        display: grid;
        gap: 16px;
        padding: 20px;
      }

      .toolbar-top {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: end;
        flex-wrap: wrap;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 3rem);
        letter-spacing: -0.04em;
      }

      .lead {
        margin: 6px 0 0;
        color: var(--muted);
        max-width: 72ch;
        line-height: 1.6;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field label {
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
      }

      select,
      input,
      button {
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel-2);
        color: var(--text);
        padding: 0 14px;
        font: inherit;
      }

      button {
        cursor: pointer;
        background: linear-gradient(180deg, rgba(52, 96, 198, 0.96), rgba(32, 64, 134, 0.96));
        border-color: rgba(98, 139, 247, 0.45);
        font-weight: 600;
      }

      .quick-links {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .quick-links button.alt {
        background: linear-gradient(180deg, rgba(33, 58, 97, 0.8), rgba(19, 35, 58, 0.8));
      }

      .viewer {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        overflow: hidden;
      }

      .pane {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: calc(100vh - 240px);
        border-right: 1px solid var(--line);
      }

      .pane:last-child { border-right: 0; }

      .pane-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(255,255,255,0.02);
      }

      .pane-head strong { font-size: 1rem; }
      .pane-head span { color: var(--muted); font-size: 0.9rem; }

      .image-wrap {
        overflow: auto;
        background:
          linear-gradient(45deg, rgba(255,255,255,0.03) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(255,255,255,0.03) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.03) 75%),
          linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.03) 75%);
        background-size: 24px 24px;
        background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      }

      .image-wrap img {
        display: block;
        width: 100%;
        height: auto;
        transform-origin: top left;
      }

      .empty {
        display: grid;
        place-items: center;
        min-height: 320px;
        color: var(--muted);
        text-align: center;
        padding: 32px;
      }

      @media (max-width: 1024px) {
        .controls,
        .viewer {
          grid-template-columns: 1fr;
        }

        .pane {
          min-height: 45vh;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .pane:last-child {
          border-bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="toolbar">
        <div class="toolbar-top">
          <div>
            <h1>Comparaison maquette / rendu</h1>
            <p class="lead">Choisis une maquette à gauche et une capture actuelle à droite. Tu peux ensuite me dire exactement ce qui ne va pas, écran par écran.</p>
          </div>
          <div class="quick-links">
            <button data-preset="auth">Preset auth</button>
            <button class="alt" data-preset="dashboard">Preset dashboard</button>
            <button class="alt" data-preset="detail">Preset detail</button>
            <button class="alt" data-preset="solver">Preset solver</button>
          </div>
        </div>

        <div class="controls">
          <div class="field">
            <label for="mockupSelect">Maquette</label>
            <select id="mockupSelect"></select>
          </div>
          <div class="field">
            <label for="currentSelect">Rendu actuel</label>
            <select id="currentSelect"></select>
          </div>
          <div class="field">
            <label for="zoomRange">Zoom</label>
            <input id="zoomRange" type="range" min="50" max="200" value="100" />
          </div>
        </div>
      </section>

      <section class="viewer">
        <article class="pane">
          <div class="pane-head">
            <div>
              <strong>Maquette</strong>
              <span id="mockupName">Aucune image sélectionnée</span>
            </div>
          </div>
          <div class="image-wrap" id="mockupWrap">
            <div class="empty">Sélectionne une maquette</div>
          </div>
        </article>

        <article class="pane">
          <div class="pane-head">
            <div>
              <strong>Site actuel</strong>
              <span id="currentName">Aucune image sélectionnée</span>
            </div>
          </div>
          <div class="image-wrap" id="currentWrap">
            <div class="empty">Sélectionne une capture actuelle</div>
          </div>
        </article>
      </section>
    </main>

    <script>
      const mockupSelect = document.getElementById('mockupSelect');
      const currentSelect = document.getElementById('currentSelect');
      const zoomRange = document.getElementById('zoomRange');
      const mockupWrap = document.getElementById('mockupWrap');
      const currentWrap = document.getElementById('currentWrap');
      const mockupName = document.getElementById('mockupName');
      const currentName = document.getElementById('currentName');

      const params = new URLSearchParams(window.location.search);
      let assets = { mockups: [], current: [] };

      const presets = {
        auth: { current: 'auth-current-2.png' },
        dashboard: { mockup: 'call_f2zPVTQnOxXhMCia39sSmipu.png', current: 'dashboard-current-2.png' },
        detail: { current: 'detail-current-2.png' },
        solver: { current: 'solver-current-2.png' },
      };

      function option(label, value) {
        const el = document.createElement('option');
        el.value = value;
        el.textContent = label;
        return el;
      }

      function renderImage(wrap, nameEl, basePath, fileName) {
        wrap.innerHTML = '';

        if (!fileName) {
          wrap.innerHTML = '<div class="empty">Aucune image sélectionnée</div>';
          nameEl.textContent = 'Aucune image sélectionnée';
          return;
        }

        const img = document.createElement('img');
        img.src = `${basePath}/${fileName}`;
        img.alt = fileName;
        img.style.width = `${zoomRange.value}%`;
        wrap.appendChild(img);
        nameEl.textContent = fileName;
      }

      function syncQuery() {
        const query = new URLSearchParams();
        if (mockupSelect.value) query.set('mockup', mockupSelect.value);
        if (currentSelect.value) query.set('current', currentSelect.value);
        if (zoomRange.value !== '100') query.set('zoom', zoomRange.value);
        history.replaceState(null, '', `/compare.html?${query.toString()}`);
      }

      function refresh() {
        renderImage(mockupWrap, mockupName, '/compare-assets/mockups', mockupSelect.value);
        renderImage(currentWrap, currentName, '/compare-assets/current', currentSelect.value);
        syncQuery();
      }

      function applyPreset(key) {
        const preset = presets[key] || {};
        if (preset.mockup && assets.mockups.includes(preset.mockup)) {
          mockupSelect.value = preset.mockup;
        }
        if (preset.current && assets.current.includes(preset.current)) {
          currentSelect.value = preset.current;
        }
        refresh();
      }

      async function boot() {
        const response = await fetch('/compare-assets/manifest.json');
        assets = await response.json();

        mockupSelect.appendChild(option('Choisir une maquette', ''));
        assets.mockups.forEach((file) => mockupSelect.appendChild(option(file, file)));

        currentSelect.appendChild(option('Choisir un rendu actuel', ''));
        assets.current.forEach((file) => currentSelect.appendChild(option(file, file)));

        const preset = params.get('preset');
        const queryMockup = params.get('mockup');
        const queryCurrent = params.get('current');
        const queryZoom = params.get('zoom');

        if (queryZoom) zoomRange.value = queryZoom;

        if (queryMockup && assets.mockups.includes(queryMockup)) {
          mockupSelect.value = queryMockup;
        }
        if (queryCurrent && assets.current.includes(queryCurrent)) {
          currentSelect.value = queryCurrent;
        }

        if (preset && presets[preset]) {
          applyPreset(preset);
        } else {
          refresh();
        }
      }

      mockupSelect.addEventListener('change', refresh);
      currentSelect.addEventListener('change', refresh);
      zoomRange.addEventListener('input', refresh);
      document.querySelectorAll('[data-preset]').forEach((button) => {
        button.addEventListener('click', () => applyPreset(button.dataset.preset));
      });

      boot().catch((error) => {
        document.body.innerHTML = `<main class="page"><section class="toolbar"><h1>Erreur</h1><p class="lead">Impossible de charger la page de comparaison : ${error.message}</p></section></main>`;
      });
    </script>
  </body>
</html>
